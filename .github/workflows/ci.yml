name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Docker is available on GitHub runners: a missing daemon must fail, not silently skip
      KURO_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pre-pull database images
        run: |
          docker pull postgres:16-alpine
          docker pull mariadb:11
      - name: Lint
        run: make lint
      - name: Unit tests (logic, input parser, config/keybinding docs checks)
        run: make test-unit
      - name: Property/fuzz tests (short run)
        run: make test-prop
      - name: Snapshot tests
        run: make test-snapshots
      - name: UI tests (cell buffer and pty)
        run: make test-ui
      - name: Integration tests (MariaDB + PostgreSQL in Docker)
        run: make test-integration
      - name: Per-layer report
        if: always()
        run: sh scripts/test-report.sh
