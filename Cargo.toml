[package]
name = "kuro"
version = "0.2.0"
edition = "2024"

[lib]
name = "kuro"
path = "src/lib.rs"

[[bin]]
name = "kuro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = "0.29.0"
libc = "0.2.190"
mysql = "28.0.3"
postgres = "0.19.14"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
zeroize = "1.9.1"

[dev-dependencies]
portable-pty = "0.9.0"
proptest = "1.12.0"
vt100 = "0.16.2"
