# kuro default configuration. Every option is documented in docs/CUSTOMIZATION.md.

[editor]
modal = true              # vi-style modes; false = always-insert, VS Code feel
tab_width = 8             # display width of a tab character
indent_style = "tabs"     # tabs | spaces
indent_size = 8           # columns per indent step when indenting with spaces
smart_whitespace_delete = true
word_suggestions = true
suggest_min_chars = 2
line_numbers = true
relative_numbers = false  # true: current line absolute, others relative (opt-in)
mouse = true
double_click_ms = 400
scroll_lines = 3
scrollbars = true             # vertical / horizontal scrollbars (hidden when everything fits)

[clipboard]
backend = "auto"          # auto | wl-clipboard | xclip | xsel | osc52

[find]
case_sensitive = false
whole_word = false
regex = false

[sql]
result_view = "split"     # split | tab
table_max_width = 120
table_max_rows = 25
column_max_width = 40
row_limit = 10000
connections_file = ""     # empty = <config dir>/connections.toml
run_fallback_key = "alt+enter"   # runs the selection/statement when the terminal cannot send Ctrl+Enter
run_line_key = "alt+l"            # runs only the current line
block_editing_when_disconnected = true

[ui]
syntax_highlight = true
kitty_keyboard = "auto"     # auto | on | off
adaptive_colors = true      # pick extension colours that stand out in your terminal theme

[sync]
enabled = true              # keep terminals that have the same file open in step
max_file_mib = 5            # bigger files open without live sync

[colors]
# Roles -> ANSI palette slot: 0-7 normal, 8-15 bright, -1 = default foreground.
# The real colours come from your terminal theme.
keyword = 5
builtin = 4
literal = 3
string = 2
number = 6
operator = 1
comment = -1              # -1: dim italic default foreground
key = 4
bracket_error = 1         # also shown in reverse video
bracket_depth = [3, 5, 6, 2, 4]   # cycled by nesting depth
